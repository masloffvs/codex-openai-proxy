name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: codex-openai-proxy
            archive_name: codex-openai-proxy-x86_64-unknown-linux-gnu.tar.gz
            artifact_name: release-x86_64-unknown-linux-gnu
            archive_type: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: codex-openai-proxy
            archive_name: codex-openai-proxy-x86_64-apple-darwin.tar.gz
            artifact_name: release-x86_64-apple-darwin
            archive_type: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            binary_name: codex-openai-proxy
            archive_name: codex-openai-proxy-aarch64-apple-darwin.tar.gz
            artifact_name: release-aarch64-apple-darwin
            archive_type: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: codex-openai-proxy.exe
            archive_name: codex-openai-proxy-x86_64-pc-windows-msvc.zip
            artifact_name: release-x86_64-pc-windows-msvc
            archive_type: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package tarball
        if: matrix.archive_type == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} ./${{ matrix.binary_name }}
          tar -czf dist/${{ matrix.archive_name }} ${{ matrix.binary_name }}
          rm -f ./${{ matrix.binary_name }}

      - name: Package zip
        if: matrix.archive_type == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "./${{ matrix.binary_name }}"
          Compress-Archive -Path "./${{ matrix.binary_name }}" -DestinationPath "dist/${{ matrix.archive_name }}" -Force
          Remove-Item "./${{ matrix.binary_name }}"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.archive_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
